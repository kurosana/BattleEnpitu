<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>バトエンツール</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
  <section id="screen-loading" class="screen active">
    <p class="loading-text">読み込み中…</p>
  </section>

  <section id="screen-start" class="screen screen-start">
    <div class="app-version-wrap" id="app-version-wrap">
      <span class="app-version" id="app-version"></span>
      <span class="app-version app-release-notes" id="app-release-notes" hidden></span>
    </div>
    <div class="screen-start-inner">
      <div class="screen-center start-buttons">
        <button type="button" class="btn-primary btn-start-large" id="btn-start">スタート</button>
        <button type="button" class="btn-outline btn-personal" id="btn-personal">個人管理モード</button>
      </div>
      <footer class="start-credits" id="start-credits" aria-label="クレジット"></footer>
    </div>
  </section>

  <section id="screen-bottles" class="screen screen-scroll">
    <div class="screen-scroll-body">
      <h1 class="screen-heading" id="bottles-heading">1人何本で遊びますか？</h1>
      <div class="count-buttons" id="bottle-buttons">
        <button type="button" class="btn-primary btn-count" data-bottles="1">1本</button>
        <button type="button" class="btn-primary btn-count" data-bottles="2">2本</button>
        <button type="button" class="btn-primary btn-count" data-bottles="3">3本</button>
      </div>
    </div>
  </section>

  <section id="screen-count" class="screen screen-scroll">
    <div class="screen-scroll-body">
      <h1 class="screen-heading" id="count-heading">何人で遊びますか？</h1>
      <div class="count-buttons" id="count-buttons">
        <button type="button" class="btn-primary btn-count" data-count="2">2人</button>
        <button type="button" class="btn-primary btn-count" data-count="3">3人</button>
        <button type="button" class="btn-primary btn-count" data-count="4">4人</button>
        <button type="button" class="btn-primary btn-count" data-count="5">5人</button>
      </div>
    </div>
  </section>

  <section id="screen-names" class="screen screen-scroll">
    <div class="screen-scroll-body">
      <h1 class="screen-heading" id="names-heading">名前を入力</h1>
      <div class="names-form" id="names-form"></div>
      <button type="button" class="btn-primary btn-game-start" id="btn-game-start">ゲームスタート！</button>
    </div>
  </section>

  <section id="screen-game" class="screen">
    <header class="game-header">
      <h1 class="game-title" id="game-title">バトエンツール</h1>
      <button type="button" class="btn-exit" id="btn-exit">終了</button>
    </header>
    <div class="game-players" id="game-players"></div>
  </section>

  <section id="screen-personal" class="screen">
    <header class="game-header">
      <h1 class="game-title" id="personal-title">個人管理</h1>
      <button type="button" class="btn-exit" id="btn-exit-personal">終了</button>
    </header>
    <div class="personal-body" id="personal-body"></div>
  </section>

  <button type="button" class="btn-exit btn-nav-fixed" id="btn-back-bottles" hidden>戻る</button>
  <button type="button" class="btn-exit btn-nav-fixed" id="btn-back-count" hidden>戻る</button>
  <button type="button" class="btn-exit btn-nav-fixed" id="btn-back-names" hidden>戻る</button>
  </div>

  <div id="dialog-confirm" class="dialog" aria-hidden="true">
    <div class="dialog-backdrop"></div>
    <div class="dialog-box">
      <p class="dialog-message" id="dialog-message"></p>
      <div class="dialog-actions">
        <button type="button" class="btn-dialog btn-dialog-yes" id="dialog-yes">はい</button>
        <button type="button" class="btn-dialog btn-dialog-no" id="dialog-no">いいえ</button>
      </div>
    </div>
  </div>

  <div id="overlay-search" class="overlay overlay-search" aria-hidden="true">
    <div class="overlay-inner search-overlay-inner">
      <div class="search-header">
        <button type="button" class="btn-back-search" id="btn-search-back-types" hidden>タイプ一覧へ</button>
        <input type="search" id="search-pokemon" placeholder="ポケモン名で検索" autocomplete="off">
        <button type="button" class="btn-close-overlay" id="btn-close-search">閉じる</button>
      </div>
      <div class="type-list" id="type-list"></div>
      <div class="search-results" id="search-results" hidden></div>
    </div>
  </div>

  <div id="overlay-edit" class="overlay overlay-panel overlay-edit" aria-hidden="true">
    <div class="panel-inner edit-panel">
      <header class="panel-header">
        <button type="button" class="btn-back-panel" id="btn-edit-back">戻る</button>
        <h2 class="panel-title" id="edit-player-name"></h2>
      </header>
      <div class="edit-body" id="edit-body"></div>
    </div>
  </div>

  <div id="overlay-move-help" class="overlay overlay-panel" aria-hidden="true">
    <div class="panel-inner move-help-panel">
      <header class="panel-header">
        <button type="button" class="btn-back-panel" id="btn-move-help-back">戻る</button>
        <h2 class="panel-title" id="move-help-title"></h2>
      </header>
      <div class="move-help-list" id="move-help-list"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
